name: Publish Python Package and Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install uv
      run: pip install uv

    - name: Extract version and changelog
      id: extract_info
      run: |
        # Extract version from tag
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

        # Get the commit message for this tag
        COMMIT_MSG=$(git log -1 --pretty=format:'%s' ${{ github.sha }})
        echo "COMMIT_MSG=$COMMIT_MSG" >> $GITHUB_OUTPUT

        # Extract changelog from git tag annotation
        CHANGELOG=$(git tag -l v$VERSION -n --format='%(contents)')
        echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
        echo "$CHANGELOG" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Build package
      run: |
        # 确保版本一致性
        VERSION=${{ steps.extract_info.outputs.VERSION }}
        echo "Building version $VERSION"

        # 清理可能存在的缓存
        rm -rf dist/ build/ *.egg-info 2>/dev/null || true

        # 构建包
        uv build

        # 验证构建的版本
        ls -la dist/

        # 检查构建的包版本是否正确
        if echo dist/* | grep -q "$VERSION"; then
          echo "✅ 构建版本正确: $VERSION"
        else
          echo "❌ 构建版本错误，期望 $VERSION"
          ls -la dist/
          exit 1
        fi

        # 验证包可以安装
        uvx --from . genome-mcp --help

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref }}
        name: Release v${{ steps.extract_info.outputs.VERSION }}
        body: |
          ## Version ${{ steps.extract_info.outputs.VERSION }}

          ${{ steps.extract_info.outputs.CHANGELOG }}

          ---

          ### 安装方式
          ```bash
          pip install genome-mcp
          ```

          ### 快速开始
          ```bash
          genome-mcp --help
          ```

          ### 功能特性
          - 🔍 智能查询解析：支持自然语言和结构化查询
          - 📊 批量数据获取：优化的批量查询，减少API调用
          - 🎯 语义搜索：理解查询意图的智能搜索
          - 🚀 多传输模式：支持STDIO、HTTP、SSE传输
          - ⚡ 异步处理：高性能异步架构
          - 📚 完整文档：详细的API文档和使用示例

          ### 配置示例
          **Claude Desktop:**
          ```json
          {
            "mcpServers": {
              "genome-mcp": {
                "command": "uvx",
                "args": ["genome-mcp"]
              }
            }
          }
          ```
        draft: false
        prerelease: false
        files: |
          dist/*

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        pip install twine
        twine upload dist/*
